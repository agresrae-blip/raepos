<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Online Store</title>
<script>try{document.documentElement.dataset.mode=localStorage.getItem("raepos_theme")||"light";}catch(e){}</script>
<link href="https://fonts.googleapis.com/css2?family=Gochi+Hand&family=Patrick+Hand&family=Quicksand:wght@500;700&family=Shantell+Sans:wght@800&display=swap" rel="stylesheet">
<style>
:root{--paper:#f8f5ee;--card:#fffdf6;--ink:#2f2b26;--mut:#7a7263;--line:#2f2b26;--shadow:rgba(47,43,38,.82);
  --mint:#bfe8cf;--blue:#bcd9f7;--peach:#ffd9b8;--yellow:#fdf3b3;--pink:#f9cdd8;--okc:#1d6f43;
  --wob1:255px 15px 225px 15px/15px 225px 15px 255px;--wob2:15px 255px 15px 225px/225px 15px 255px 15px;
  --wob3:58% 42% 55% 45%/48% 60% 40% 52%}
html[data-mode="dark"]{--paper:#211e1a;--card:#2b2723;--ink:#efe6d4;--mut:#a89d87;--line:#efe6d4;
  --shadow:rgba(0,0,0,.55);--mint:#3e6b52;--blue:#3c5a7d;--peach:#8a5c33;--yellow:#7d6d2e;--pink:#7d4a58;--okc:#8fe0b1}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--paper);color:var(--ink);min-height:100vh;padding-bottom:96px;
  font-family:"Patrick Hand",cursive;font-size:18px;
  background-image:radial-gradient(rgba(120,110,95,.28) 1.3px,transparent 1.3px);background-size:26px 26px}
.wrap{max-width:640px;margin:0 auto;padding:20px 16px}
.head{text-align:center;padding:18px 0 8px}
.head img{width:76px;height:76px;object-fit:contain;border-radius:var(--wob3);background:#fff;padding:4px;border:2.5px solid var(--line);box-shadow:3px 4px 0 var(--shadow)}
.head h1{font-family:"Gochi Hand",cursive;font-size:2rem;margin-top:10px}
.head .sub{color:var(--mut);font-size:.9rem;margin-top:4px}
.err{background:var(--pink);border:2.5px solid var(--line);border-radius:var(--wob1);padding:24px;text-align:center;margin-top:30px;box-shadow:4px 4px 0 var(--shadow)}
.err h2{margin-bottom:6px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}
.item{background:var(--card);border:2.5px solid var(--line);border-radius:var(--wob1);padding:14px;text-align:center;transition:.12s;box-shadow:3px 4px 0 var(--shadow);cursor:pointer}
.item:nth-child(even){border-radius:var(--wob2)}
.item:active{transform:translate(2px,2px) rotate(-1deg);box-shadow:1px 1px 0 var(--shadow);background:var(--yellow)}
.item .em{font-size:1.9rem}
.item h4{font-family:"Shantell Sans",cursive;font-weight:800;font-size:.82rem;margin:6px 0;min-height:32px}
.item .p{font-family:"Gochi Hand",cursive;font-size:22px;color:var(--okc)}
.item .s{color:var(--mut);font-size:.7rem;margin-top:4px}
.cartbar{position:fixed;bottom:0;left:0;right:0;background:var(--yellow);color:var(--ink);border-top:2.5px solid var(--line);padding:14px 20px;display:flex;justify-content:space-between;align-items:center;width:100%;font-family:"Gochi Hand",cursive;font-size:1.2rem;cursor:pointer;z-index:5;box-shadow:0 -5px 0 var(--shadow)}
.modal{position:fixed;inset:0;background:rgba(40,35,28,.55);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:640px;border:2.5px solid var(--line);border-bottom:none;border-radius:24px 24px 0 0;padding:22px 18px;max-height:88vh;overflow-y:auto}
.sheet h3{font-family:"Gochi Hand",cursive;font-size:1.4rem;margin-bottom:12px}
.ci{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:2px dashed var(--mut);font-size:.95rem}
.ci button{width:32px;height:32px;border-radius:var(--wob3);border:2px solid var(--line);background:var(--peach);color:var(--ink);font-size:1.1rem;cursor:pointer;box-shadow:2px 2px 0 var(--shadow)}
label{display:block;font-size:.8rem;color:var(--mut);margin:10px 0 4px}
input,textarea{width:100%;background:var(--card);border:2.5px solid var(--line);border-radius:var(--wob2);color:var(--ink);padding:11px 13px;font-size:.98rem;outline:none;font-family:"Patrick Hand",cursive}
input:focus,textarea:focus{background:var(--yellow)}
.pay{display:flex;gap:8px;margin:8px 0}
.pay button{flex:1;padding:11px;border-radius:var(--wob1);border:2.5px solid var(--line);background:var(--card);color:var(--ink);font-family:"Gochi Hand",cursive;font-size:.95rem;cursor:pointer;box-shadow:2px 2px 0 var(--shadow)}
.pay button.sel{border-color:var(--line);background:var(--mint);transform:translate(2px,2px);box-shadow:0 0 0 var(--shadow)}
.btn{width:100%;margin-top:14px;padding:14px;border:2.5px solid var(--line);border-radius:var(--wob1);background:var(--mint);color:var(--ink);font-family:"Gochi Hand",cursive;font-size:1.2rem;cursor:pointer;box-shadow:3px 3px 0 var(--shadow)}
.btn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--shadow)}
.gnote{background:var(--blue);border:2px solid var(--line);border-radius:var(--wob2);padding:10px 12px;font-size:.85rem;margin-top:8px;box-shadow:2px 2px 0 var(--shadow)}
.done{text-align:center;padding:40px 10px}
.done .big{font-size:3rem}
.done h2{font-family:"Gochi Hand",cursive;margin:12px 0 6px}
.done p{color:var(--mut);font-size:.95rem}
.totrow{display:flex;justify-content:space-between;font-family:"Gochi Hand",cursive;font-size:1.3rem;margin:12px 0;background:var(--mint);border:2.5px solid var(--line);border-radius:var(--wob2);padding:8px 14px}
.themeFab{position:fixed;top:14px;right:14px;z-index:6;border:2.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:var(--wob1);padding:7px 14px;font-family:"Gochi Hand",cursive;font-size:1rem;cursor:pointer;box-shadow:2px 2px 0 var(--shadow)}
.hidden{display:none}
</style>
</head>
<body>
<button class="themeFab" onclick="toggleTheme()">🌔</button>
<div class="wrap">
  <div class="head" id="head"></div>
  <div id="content">
    <div class="err hidden" id="offBox"><h2>😴 Store is closed</h2>This store is not accepting online orders right now. Check back later!</div>
    <div class="grid" id="grid"></div>
  </div>
  <div id="doneBox" class="done hidden"></div>
</div>

<button id="cartbar" class="cartbar hidden" onclick="openCart()"><span>🛒 View cart</span><span id="cartTotal">₱0.00</span></button>

<div id="cartModal" class="modal hidden" onclick="if(event.target===this)closeCart()">
  <div class="sheet">
    <h3>🛒 Your Order</h3>
    <div id="cartItems"></div>
    <div class="ci" style="border-bottom:none"><span style="color:#8b93b5">Items subtotal</span><span id="itemsSub">₱0.00</span></div>
    <div class="ci"><span style="color:#8b93b5">📦 Delivery fee</span><span id="feeOut">₱0.00</span></div>
    <div class="totrow"><span>Total</span><span id="cartTotal2">₱0.00</span></div>
    <h3 style="margin-top:16px">📦 Delivery Details</h3>
    <label>Your Name *</label><input id="fName" placeholder="e.g. Juan Dela Cruz">
    <label>Mobile Number *</label><input id="fPhone" placeholder="09xx xxx xxxx" inputmode="tel">
    <label>Delivery Address *</label><textarea id="fAddr" rows="2" placeholder="House #, Street, Barangay"></textarea>
    <label>Notes for the store (optional)</label><input id="fNotes" placeholder="e.g. extra ice, call on arrival">
    <label>Payment Method</label>
    <div class="pay">
      <button id="payCod" class="sel" onclick="setPay('COD')">💵 Cash on Delivery</button>
      <button id="payGcash" onclick="setPay('GCash')">🔵 GCash</button>
    </div>
    <div id="gcashBox" class="gnote hidden"></div>
    <label id="refLbl" class="hidden">GCash Reference Number (type "NONE" if paying on arrival)</label>
    <input id="fRef" class="hidden" placeholder="e.g. 9021 4588 1122">
    <button class="btn" onclick="placeOrder()">Place Order ▸</button>
    <p id="formErr" style="color:#ff5470;font-size:.8rem;margin-top:8px;text-align:center"></p>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
function toggleTheme(){
  const el = document.documentElement;
  const next = el.dataset.mode === "dark" ? "light" : "dark";
  el.dataset.mode = next;
  try{ localStorage.setItem("raepos_theme", next); }catch(e){}
}
const peso = n => "₱" + (Math.round(n*100)/100).toLocaleString("en-PH",{minimumFractionDigits:2});
const pathParts = location.pathname.split("/");
const code = pathParts[2] || "";
const TRACK_MODE = pathParts[3] === "order" && pathParts[4];
let store = null, items = [], cart = {}, pay = "COD";

function trackPage(){
  const oid = pathParts[4].toUpperCase();
  const render = ()=>{
    fetch("/api/shop/" + encodeURIComponent(code) + "/order/" + oid).then(r=>r.json()).then(d=>{
      if(!d.ok){ $("#content").innerHTML = '<div class="err"><h2>Order not found</h2>Check your order link.</div>'; return; }
      const S = { new:["🆕","Waiting for the store to confirm"], preparing:["👨‍🍳","Being prepared"], delivering:["🛵","On its way to you!"], done:["✅","Delivered — enjoy!"], rejected:["❌","Sorry — the store rejected this order"] }[d.order.status] || ["⏳", d.order.status];
      $("#head").innerHTML = (d.store.logo?`<img src="${d.store.logo}" alt="logo">`:"") + `<h1>${d.store.name}</h1><div class="sub">Order tracking</div>`;
      $("#content").innerHTML = `
        <div class="err" style="background:rgba(0,212,255,.06);border-color:rgba(0,212,255,.35);color:inherit">
          <div style="font-size:3rem">${S[0]}</div>
          <h2 style="color:#fff">${S[1]}</h2>
          <p style="color:#8b93b5">Order <b style="color:#fff">${d.order.id}</b> · ${new Date(d.order.ts).toLocaleString("en-PH")}</p>
        </div>
        <div class="sheet" style="position:static;max-width:100%;margin-top:14px">
          ${d.order.items.map(i=>`<div class="ci"><span>${i.qty}× ${i.name}</span><span>${peso(i.qty*i.price)}</span></div>`).join("")}
          ${d.order.fee?`<div class="ci"><span style="color:#8b93b5">Delivery fee</span><span>${peso(d.order.fee)}</span></div>`:""}
          <div class="totrow"><span>Total (${d.order.payment==="GCash"?"GCash":"COD"})</span><span>${peso(d.order.total)}</span></div>
          <p style="color:#8b93b5;font-size:.75rem;text-align:center">This page updates automatically — refresh anytime.</p>
        </div>`;
    }).catch(()=>{});
  };
  render();
  setInterval(render, 20000);
}
if (TRACK_MODE) trackPage();

fetch("/api/shop/" + encodeURIComponent(code)).then(r=>r.json()).then(d=>{
  if(!d.ok){ $("#offBox").classList.remove("hidden"); return; }
    if (d.store.theme) document.documentElement.dataset.theme = d.store.theme;
  const F = { doodle:["\"Patrick Hand\",cursive","\"Gochi Hand\",cursive"],
              clean:["\"Segoe UI\",system-ui,sans-serif","\"Segoe UI\",system-ui,sans-serif"],
              round:["Quicksand,\"Segoe UI\",sans-serif","Quicksand,\"Segoe UI\",sans-serif"] }[d.store.font || "doodle"] || null;
  if (F){ document.documentElement.style.setProperty("--font-hand", F[0]); document.documentElement.style.setProperty("--font-title", F[1]); }
  if (TRACK_MODE) return; // tracking page has its own header
  store = d.store; items = d.products;
  $("#head").innerHTML = (store.logo?`<img src="${store.logo}" alt="logo">`:"") +
    `<h1>${store.name}</h1><div class="sub">Order online — we deliver!${store.phone?" · 📞 "+store.phone:""}</div>`;
  renderGrid();
}).catch(()=>{ $("#offBox").classList.remove("hidden"); });

function renderGrid(){
  $("#grid").innerHTML = items.map(p=>`
    <div class="item" onclick="add('${p.name.replace(/'/g,"\\'")}')">
      ${p.img?`<img src="${p.img}" alt="" style="width:100%;height:110px;object-fit:cover;border-radius:12px">`:`<div class="em">${p.emoji}</div>`}<h4>${p.name}</h4>
      <div class="p">${peso(p.price)}</div><div class="s">${p.stock} available</div>
    </div>`).join("");
}
function add(name){
  const p = items.find(x=>x.name===name);
  if((cart[name]||0) >= p.stock) return;
  cart[name] = (cart[name]||0) + 1; cartUI();
}
function qty(name, d){
  cart[name] = (cart[name]||0) + d;
  if(cart[name] <= 0) delete cart[name];
  cartUI(); if(!Object.keys(cart).length) closeCart();
}
function cartSum(){ return items.reduce((a,p)=>a + (cart[p.name]||0)*p.price, 0); }
function cartCount(){ return Object.values(cart).reduce((a,b)=>a+b, 0); }
function cartUI(){
  const sub = cartSum();
  const fee = store ? (+store.deliveryFee || 0) : 0;
  const t = peso(sub + fee);
  $("#cartTotal").textContent = t;
  $("#itemsSub").textContent = peso(sub);
  $("#feeOut").textContent = peso(fee);
  $("#cartTotal2").textContent = t;
  $("#cartbar").classList.toggle("hidden", !cartCount());
  $("#cartItems").innerHTML = items.filter(p=>cart[p.name]).map(p=>`
    <div class="ci"><span>${p.emoji} ${p.name}<br><small style="color:#8b93b5">${peso(p.price)} each</small></span>
      <span><button onclick="qty('${p.name.replace(/'/g,"\\'")}',-1)">−</button> <b>${cart[p.name]}</b>
      <button onclick="qty('${p.name.replace(/'/g,"\\'")}',1)">＋</button></span></div>`).join("");
}
function openCart(){ if(!cartCount()) return; cartUI(); $("#cartModal").classList.remove("hidden"); $("#formErr").textContent=""; }
function closeCart(){ $("#cartModal").classList.add("hidden"); }
function setPay(p){
  pay = p;
  $("#payCod").classList.toggle("sel", p==="COD");
  $("#payGcash").classList.toggle("sel", p==="GCash");
  $("#gcashBox").classList.toggle("hidden", p!=="GCash");
  $("#refLbl").classList.toggle("hidden", p!=="GCash");
  $("#fRef").classList.toggle("hidden", p!=="GCash");
  if(p==="GCash" && store){
    $("#gcashBox").innerHTML =
      (store.qr ? `<img src="${store.qr}" alt="GCash QR" style="width:100%;max-width:230px;border-radius:14px;background:#fff;padding:10px;display:block;margin:0 auto 8px">` : "") +
      (store.gcash
        ? `Scan this QR with your GCash app or send to: <b>${store.gcash}</b>${store.gcashName?" — "+store.gcashName:""}`
        : "Send your GCash payment to the number the store gives you, then enter the reference number.");
  }
}
async function placeOrder(){
  const name = $("#fName").value.trim(), phone = $("#fPhone").value.trim(), addr = $("#fAddr").value.trim();
  if(!name || !phone || !addr){ $("#formErr").textContent = "Please fill in your name, mobile number and delivery address."; return; }
  const body = {
    customer: { name, phone, address: addr, notes: $("#fNotes").value.trim() },
    items: Object.entries(cart).map(([n,q])=>({name:n, qty:q})),
    payment: pay, ref: $("#fRef").value.trim()
  };
  const btn = document.querySelector(".btn"); btn.disabled = true; btn.textContent = "Sending…";
  try{
    const r = await fetch(`/api/shop/${encodeURIComponent(code)}/order`, {
      method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(body)
    }).then(x=>x.json());
    if(!r.ok){ $("#formErr").textContent = r.error || "Could not place order."; btn.disabled = false; btn.textContent = "Place Order ▸"; return; }
    closeCart();
    $("#content").classList.add("hidden");
    const d = $("#doneBox"); d.classList.remove("hidden");
    const trackUrl = location.origin + "/shop/" + code + "/order/" + r.orderId;
    d.innerHTML = `<div class="big">✅</div><h2>Order placed!</h2>
      <p>Order <b>${r.orderId}</b> — total <b>${peso(r.total)}</b><br>
      ${pay==="COD"?"Pay cash on delivery.":"Pay via GCash now if you haven't yet."}<br>
      The store will confirm your order soon. Thank you! 💙</p>
      <div class="gnote" style="margin-top:14px;text-align:left"><b>🔗 Track your order here</b> (save this!):<br>
      <input id="trackUrlBox" readonly value="${trackUrl}" style="margin-top:6px;font-size:.75rem">
      <button class="btn" style="margin-top:6px;padding:10px" onclick="navigator.clipboard.writeText('${trackUrl}').then(()=>this.textContent='Copied!')">Copy link</button></div>`;
  }catch(e){
    $("#formErr").textContent = "Connection problem — please try again.";
    btn.disabled = false; btn.textContent = "Place Order ▸";
  }
}
</script>
</body>
</html>
